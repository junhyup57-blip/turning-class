<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14251f">
<title>선반 축 확대도 | TURNING CLASS</title>
<style>
:root{--ink:#17231e;--muted:#68766f;--paper:#f5f4ef;--card:#fffefa;--line:#e3e3d9;--green:#315d49;--lime:#c9df8a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}.shell{max-width:1280px;margin:auto;padding:0 28px}a{color:inherit;text-decoration:none}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.04em}.brand b{color:var(--green)}.back{font-size:13px;color:var(--green);font-weight:700}.intro{padding:46px 0 26px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--green)}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.07em;margin:10px 0}.intro p{color:var(--muted);font-size:14px;line-height:1.7;margin:0}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:8px 0 70px}.item{border:1px solid var(--line);background:var(--card);border-radius:9px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;padding:0;transition:.18s}.item:hover{transform:translateY(-3px);border-color:#9eae9d;box-shadow:0 8px 22px #192d2010}.thumb{height:250px;display:grid;place-items:center;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain}.label{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.label strong{font-size:14px}.label span{font-size:10px;color:var(--green);font-weight:750}.modal{position:fixed;inset:0;background:#101814ed;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modal.open{display:flex}.modal img{max-width:min(96vw,1500px);max-height:88vh;object-fit:contain;background:white;border-radius:4px}.close{position:absolute;top:18px;right:24px;border:1px solid #ffffff66;background:transparent;color:white;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}.caption{position:absolute;bottom:12px;color:white;font-size:13px}.footer{border-top:1px solid var(--line);padding:22px 0 32px;color:var(--muted);font-size:11px}@media(max-width:900px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:620px){.shell{padding:0 16px}.topbar{height:64px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.thumb{height:190px}.intro{padding-top:34px}.modal{padding:12px}}
</style>
</head><body><div class="shell"><header class="topbar"><a class="brand" href="index.html">TURNING <b>／</b> CLASS</a><a class="back" href="index.html#learn">← 수업 자료</a></header><main><section class="intro"><div class="eyebrow">Lathe shaft drawings</div><h1>선반 축 확대도</h1><p>한글 원본의 37쪽 도면을 모아 보았습니다. 그림을 누르면 크게 볼 수 있습니다.</p></section><section class="gallery" id="gallery" aria-label="선반 축 확대도 모음"></section></main><footer class="footer">TURNING / CLASS · 선반 가공 수업 자료</footer></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="확대 도면"><button class="close" id="close" aria-label="닫기">×</button><img id="large" alt=""><div class="caption" id="caption"></div></div>
<script>
const gallery=document.getElementById('gallery'),modal=document.getElementById('modal'),large=document.getElementById('large'),caption=document.getElementById('caption');
for(let n=1;n<=37;n++){const number=String(n).padStart(2,'0'),src=`axis-drawing-${number}.png`,button=document.createElement('button');button.className='item';button.type='button';button.setAttribute('aria-label',`${n}번 축 확대도 크게 보기`);button.innerHTML=`<div class="thumb"><img src="${src}" alt="${n}번 선반 축 확대도" loading="lazy"></div><div class="label"><strong>${n}번 도면</strong><span>크게 보기 ↗</span></div>`;button.addEventListener('click',()=>{large.src=src;large.alt=`${n}번 선반 축 확대도`;caption.textContent=`${n}번 선반 축 확대도`;modal.classList.add('open');document.getElementById('close').focus()});gallery.appendChild(button)}
function closeModal(){modal.classList.remove('open');large.src=''}document.getElementById('close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
