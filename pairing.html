<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14251f"><title>2인 1조 편성 | TURNING CLASS</title>
<style>
:root{--ink:#18241e;--muted:#68766f;--paper:#f4f4ef;--card:#fffefa;--line:#e2e4da;--green:#315d49;--lime:#c9df8a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1050px;margin:auto;padding:0 24px}.bar{height:69px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:-.04em}.brand b{color:var(--green)}.back{font-size:12px;color:var(--green);font-weight:750}.intro{padding:36px 0 22px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--green);font-weight:850}.intro h1{font-size:34px;letter-spacing:-.06em;margin:8px 0}.intro p{font-size:13px;color:var(--muted);margin:0;line-height:1.7}.layout{display:grid;grid-template-columns:1fr 1fr;gap:17px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head strong{font-size:14px}.head span{font-size:10px;color:var(--muted)}.roster{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.student{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#fff}.student label{width:24px;color:#819087;font:700 10px/1.4 "Cascadia Code",monospace}.student input{border:0;outline:0;width:100%;font:12px inherit;color:var(--ink);background:transparent;padding:4px 0}.actions{padding:0 14px 14px;display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:6px;background:#fffefa;padding:10px 13px;font-size:11px;font-weight:750;cursor:pointer;color:#37463e}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:hover{filter:brightness(.97)}.actions .primary{flex:1}.pairs{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.pair{min-height:69px;border:1px solid var(--line);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:#fff}.pair-label{font-size:9px;letter-spacing:.1em;color:#758279;font-weight:800}.pair-names{font-size:13px;font-weight:740;letter-spacing:-.02em}.pair-names i{font-style:normal;color:#829187;padding:0 5px}.empty{padding:28px 17px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}.result-actions{padding:0 12px 13px;display:flex;justify-content:flex-end;gap:7px}.foot{padding:14px 0 28px;color:var(--muted);font-size:10px;line-height:1.7}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:#20392e;color:white;border-radius:6px;padding:10px 14px;font-size:12px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.shell{padding:0 15px}.layout{grid-template-columns:1fr}.intro h1{font-size:29px}.pairs{grid-template-columns:1fr 1fr}}@media(max-width:390px){.roster{gap:6px;padding:10px}.student{gap:5px;padding:5px 6px}.student input{font-size:11px}.pairs{gap:6px;padding:9px}.pair{padding:9px 8px}.pair-names{font-size:12px}}@media print{body{background:#fff}.bar,.intro,.roster-panel,.result-actions,.foot{display:none!important}.shell{max-width:none;padding:0}.layout{display:block}.pairs-panel{border:0}.head{padding:0 0 12px}.pairs{grid-template-columns:repeat(2,1fr);padding:0}.pair{min-height:74px;break-inside:avoid}}
</style><script>try{if(localStorage.getItem("turning-class-entry-access")!=="ok")document.documentElement.classList.add("classroom-gate-pending")}catch(e){document.documentElement.classList.add("classroom-gate-pending")}</script><link rel="stylesheet" href="classroom-gate.css"><script src="classroom-gate.js" defer></script></head><body><div class="shell"><header class="bar"><a class="brand" href="index.html">TURNING <b>／</b> CLASS</a><a class="back" href="index.html">← 수업 홈</a></header><main><section class="intro"><div class="eyebrow">CLASS ACTIVITY · PAIR MAKER</div><h1>오늘의 실습 짝을 정해요.</h1><p>학생 이름을 입력하고 짝 편성 버튼을 누르면 20명이 무작위로 2인 1조, 10개 조로 나뉩니다.</p></section><div class="layout"><section class="panel roster-panel"><div class="head"><strong>학생 명단</strong><span>20명 · 이름은 이 브라우저에 저장</span></div><div class="roster" id="roster"></div><div class="actions"><button class="btn primary" id="make">짝 무작위 편성</button><button class="btn" id="reset">명단 초기화</button></div></section><section class="panel pairs-panel"><div class="head"><strong>짝 편성 결과</strong><span id="pairCount">편성 전</span></div><div id="pairs" class="empty">왼쪽에 학생 이름을 입력한 뒤<br>짝 무작위 편성 버튼을 눌러주세요.</div><div class="result-actions"><button class="btn" id="copy" disabled>결과 복사</button><button class="btn" id="print" disabled>인쇄</button></div></section></div><div class="foot">명단과 편성 결과는 현재 브라우저에 저장됩니다. 다른 기기와 공유되지 않습니다.</div></main></div><div class="toast" id="toast">결과를 복사했습니다.</div>
<script>
const roster=document.getElementById("roster"),pairArea=document.getElementById("pairs"),pairCount=document.getElementById("pairCount"),copyButton=document.getElementById("copy"),printButton=document.getElementById("print"),toast=document.getElementById("toast");let currentPairs=[];const names=JSON.parse(localStorage.getItem("turning-class-student-names")||"null")||Array.from({length:20},(_,i)=>`학생 ${String(i+1).padStart(2,"0")}`);
for(let i=0;i<20;i++){const wrap=document.createElement("div");wrap.className="student";const label=document.createElement("label");label.textContent=String(i+1).padStart(2,"0");const input=document.createElement("input");input.type="text";input.maxLength=24;input.value=names[i]||"";input.setAttribute("aria-label",`학생 ${i+1} 이름`);input.addEventListener("input",saveNames);wrap.append(label,input);roster.append(wrap)}
function saveNames(){const values=[...roster.querySelectorAll("input")].map(x=>x.value);localStorage.setItem("turning-class-student-names",JSON.stringify(values))}
function renderPairs(pairs){pairArea.className="pairs";pairArea.replaceChildren();pairs.forEach((p,i)=>{const card=document.createElement("article");card.className="pair";const label=document.createElement("span");label.className="pair-label";label.textContent=`GROUP ${String(i+1).padStart(2,"0")}`;const text=document.createElement("div");text.className="pair-names";text.textContent=`${p[0]}  ·  ${p[1]}`;card.append(label,text);pairArea.append(card)});pairCount.textContent="10개 조 · 20명";copyButton.disabled=false;printButton.disabled=false;localStorage.setItem("turning-class-pairs",JSON.stringify(pairs))}
document.getElementById("make").addEventListener("click",()=>{saveNames();const list=[...roster.querySelectorAll("input")].map((x,i)=>x.value.trim()||`학생 ${String(i+1).padStart(2,"0")}`);for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}currentPairs=Array.from({length:10},(_,i)=>list.slice(i*2,i*2+2));renderPairs(currentPairs)});
document.getElementById("reset").addEventListener("click",()=>{roster.querySelectorAll("input").forEach((x,i)=>x.value=`학생 ${String(i+1).padStart(2,"0")}`);saveNames()});copyButton.addEventListener("click",async()=>{const text=currentPairs.map((p,i)=>`${i+1}조: ${p[0]} / ${p[1]}`).join("\n");try{await navigator.clipboard.writeText(text)}catch{const temp=document.createElement("textarea");temp.value=text;document.body.append(temp);temp.select();document.execCommand("copy");temp.remove()}toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),1400)});printButton.addEventListener("click",()=>window.print());const saved=JSON.parse(localStorage.getItem("turning-class-pairs")||"null");if(saved&&saved.length===10){currentPairs=saved;renderPairs(saved)}
</script></body></html>
